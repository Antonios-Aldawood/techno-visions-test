server:
  port: 8081

spring:
  application:
    name: order-system-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:order_system}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:order_system_user}
    password: ${DB_PASSWORD:order_system_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

internal:
  api-key: ${INTERNAL_API_KEY:local-dev-internal-key}

logging:
  level:
    com.technovisions.ordersystem: INFO
    org.hibernate.SQL: WARN
