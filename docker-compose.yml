services:
  mysql:
    image: mysql:8.0
    container_name: order-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: order_system
      MYSQL_USER: order_system_user
      MYSQL_PASSWORD: order_system_pass
    ports:
      - "3306:3306"
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-system-service:
    build: ./order-system-service
    container_name: order-system-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: order_system
      DB_USERNAME: order_system_user
      DB_PASSWORD: order_system_pass
      INTERNAL_API_KEY: local-dev-internal-key
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  order-aggregator-service:
    build: ./order-aggregator-service
    container_name: order-aggregator-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INTERNAL_API_KEY: local-dev-internal-key
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      - order-system-service
